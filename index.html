<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discos</title>
<meta name="theme-color" content="#18202C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Discos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#E4E8ED; --ink:#18202C; --ink-2:#586273; --line:#D0D6DE;
  --red:#D12B3A; --blue:#1F5FB0; --yellow:#E3A700; --green:#1E9A5A; --steel:#98A1AE; --wplate:#F6F7F9;
  --body:#D6DBE2; --m-idle:#C2C9D3; --scrim:rgba(16,22,30,.45);
  --day:var(--red);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161D; --surface:#1A2029; --surface-2:#252D39; --ink:#E8ECF2; --ink-2:#9BA6B7; --line:#323B49;
    --red:#EE4A5B; --blue:#4F8DE2; --yellow:#F2C230; --green:#38B879; --steel:#707B8B; --wplate:#DADDE3;
    --body:#2B3340; --m-idle:#3A4453; --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161D; --surface:#1A2029; --surface-2:#252D39; --ink:#E8ECF2; --ink-2:#9BA6B7; --line:#323B49;
  --red:#EE4A5B; --blue:#4F8DE2; --yellow:#F2C230; --green:#38B879; --steel:#707B8B; --wplate:#DADDE3;
  --body:#2B3340; --m-idle:#3A4453; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
img,svg,video{max-width:100%}
.display{font-stretch:72%;font-weight:800;letter-spacing:-.005em;line-height:1.02}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.hide{display:none!important}
.wrap{max-width:580px;margin:0 auto;padding:14px 16px 104px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font-size:34px}
.pchip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px 0 8px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font-weight:650;font-size:15px}
.dot{width:22px;height:22px;border-radius:50%;flex:none;display:inline-block;border:2px solid rgba(0,0,0,.08)}
.dot.sm{width:12px;height:12px;border-width:0}
.c-red{background:var(--red)} .c-blue{background:var(--blue)} .c-yellow{background:var(--yellow)}
.c-green{background:var(--green)} .c-steel{background:var(--steel)} .c-white{background:var(--wplate);border-color:var(--line)}

h2.sec{font-size:15px;font-weight:700;margin:26px 0 10px;font-stretch:90%}
.routine-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.routine-line .name{font-size:22px;font-stretch:80%;font-weight:750;margin:0}

.day{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;width:100%;text-align:left;
  padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);margin-bottom:10px}
.day .t{font-size:21px;font-stretch:78%;font-weight:760;line-height:1.1;margin:0 0 6px}
.day .meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600;line-height:1.5;white-space:nowrap}
.chip.out{background:transparent;border:1px solid var(--line)}
.resume{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;background:var(--ink);color:var(--bg);margin-bottom:14px}
.resume b{font-weight:700}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface);font-weight:650;font-size:15px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.day-c{background:var(--day);border-color:var(--day);color:var(--on-day,#fff)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkish{background:none;border:0;padding:0;color:var(--blue);font-weight:650;text-decoration:underline;text-underline-offset:3px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:17px;font-stretch:85%;font-weight:750}
.card p{margin:0 0 8px}
.tips{margin:0;padding-left:20px}
.tips li{margin:0 0 8px}
.empty{padding:22px 16px;text-align:center;border:1.5px dashed var(--line);border-radius:18px;color:var(--ink-2)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:580px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:650;color:var(--ink-2)}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{stroke:var(--ink)}
.nav svg{width:24px;height:24px;fill:none;stroke:var(--ink-2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:580px;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px;font-size:22px;font-stretch:78%;font-weight:780}
.field{display:block;margin:0 0 12px}
.field span{display:block;font-size:14px;font-weight:650;margin-bottom:6px}
.inp,textarea.inp,select.inp{width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px}
textarea.inp{min-height:180px;resize:vertical;font-size:14px;line-height:1.4}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:650}
.pick button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}

/* session */
.session{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
.s-head{max-width:580px;width:100%;margin:0 auto;padding:10px 12px 8px}
.s-bar{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.s-title{font-size:15px;font-weight:700;line-height:1.2;min-width:0}
.s-title .d{display:block;font-size:12.5px;color:var(--ink-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segs{display:flex;gap:4px;margin-top:10px}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--surface-2)}
.segs i.done{background:var(--day)}
.segs i.cur{background:var(--ink)}
.parts{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.parts button{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 12px 0 7px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:650;font-size:14px}
.parts button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.track{flex:1;min-height:0;position:relative;overflow:hidden;overflow:clip;touch-action:pan-y}
.pages{display:flex;height:100%;transition:transform .32s cubic-bezier(.2,.75,.25,1);will-change:transform}
.page{flex:0 0 100%;height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.page .in{max-width:580px;margin:0 auto;padding:6px 16px 110px}
.ex-name{font-size:34px;margin:6px 0 10px}
.target{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.target .chip{font-size:14px;padding:5px 11px}
.target .chip b{font-weight:800}

.fig{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto;max-height:300px}
.fig .ctl{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:0 10px 10px}
.fig .ctl .hint{margin-right:auto;font-size:12.5px;color:var(--ink-2);font-weight:600}
.fig svg{touch-action:pan-y;cursor:grab}
.fig .views{display:flex;gap:3px;margin:0 10px 8px;background:var(--surface-2);border-radius:10px;padding:3px}
.fig .views button{flex:1;min-height:34px;border:0;border-radius:8px;background:transparent;font-size:13px;font-weight:650;padding:0 4px}
.fig .views button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.set.skipped input{opacity:.45;text-decoration:line-through}
.set.skipped .tick{border-style:dashed}
.set .tick.undo{border-style:dashed;border-color:var(--ink-2)}
.set .tick.undo svg{stroke:var(--ink)}
.skiptag{grid-column:2/5;font-size:12px;font-weight:650;color:var(--ink-2);margin-top:-2px}
.combo-t{margin:6px 0 0;font-weight:650}
.fig .ctl a,.fig .ctl button{min-height:34px;font-size:13px}

.sugg{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.sugg .kg{font-size:46px;margin:0}
.sugg .kg small{font-size:20px;font-weight:700;margin-left:4px}
.plates{margin-top:10px;background:var(--surface-2);border-radius:12px;padding:8px 10px}
.plates svg{display:block;width:100%;height:auto;max-height:64px}

.person .p-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.person .p-who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:18px;font-weight:760;font-stretch:88%;padding-top:4px}
.person .p-kg{text-align:right;white-space:nowrap}
.person .p-kg b{font-size:42px;line-height:1}
.person .p-kg small{font-size:15px;font-weight:700;margin-left:3px}
.person .p-why{margin:4px 0 10px;color:var(--ink-2)}
.person.complete{border-color:var(--green)}
.okmark{font-size:12px;font-weight:800;color:#fff;background:var(--green);border-radius:6px;padding:1px 7px}
.parts .pp{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 12px 0 7px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:650;font-size:14px}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:26px minmax(0,1fr) 16px minmax(0,1fr) 48px;gap:6px;align-items:center}
.set .n{font-weight:800;font-size:15px;color:var(--ink-2);text-align:center}
.set .x{text-align:center;color:var(--ink-2);font-weight:700}
.nin{position:relative}
.nin input{width:100%;height:48px;padding:0 30px 0 8px;border-radius:12px;border:1px solid var(--line);background:var(--bg);
  font-size:20px;font-weight:750;text-align:center;font-variant-numeric:tabular-nums;font-stretch:90%}
.nin input::placeholder{color:var(--ink-2);opacity:.7}
.nin span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:650;color:var(--ink-2);pointer-events:none}
.tick{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0}
.tick svg{width:24px;height:24px;fill:none;stroke:var(--ink-2);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.set.done .tick{background:var(--green);border-color:var(--green)}
.set.done .tick svg{stroke:#fff}
.set.done input{border-color:transparent;background:var(--surface-2)}
.set .play{grid-column:2/5;justify-self:start}
.rir{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.rir .pick button{min-height:40px;padding:0 14px}
.donebar{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--day);color:var(--on-day,#fff);display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
.donebar button{background:rgba(255,255,255,.22);border:0;color:inherit;min-height:40px;padding:0 14px;border-radius:10px;font-weight:700}

.musc{display:grid;grid-template-columns:1fr;gap:8px}
.musc svg{width:100%;height:auto;max-height:260px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend .chip i{width:10px;height:10px;border-radius:50%;display:inline-block}

.rec-steps{margin:0 0 12px;padding-left:20px}
.rec-steps li{margin-bottom:6px}
.frames{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.frames img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.frames figure{margin:0;position:relative}
.frames figcaption{position:absolute;left:4px;top:4px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;border-radius:6px;padding:0 5px}
.preview video{width:100%;border-radius:12px;background:#000;max-height:320px;display:block}
.ai-out{margin-top:10px}
.score{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.score b{font-size:44px}
.fixes{list-style:none;margin:0;padding:0}
.fixes li{border-left:4px solid var(--day);padding:6px 0 6px 12px;margin-bottom:10px}
.fixes li b{display:block}
.warn{background:color-mix(in srgb,var(--red) 14%,var(--surface));border-radius:12px;padding:10px 12px;margin:8px 0}
.note{background:var(--surface-2);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}

.timer{position:absolute;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:5;max-width:556px;margin:0 auto;
  background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.timer .tl{flex:1;min-width:0}
.timer .tl small{display:block;font-size:12.5px;opacity:.75;font-weight:600}
.timer .tl b{font-size:30px}
.timer button{min-height:40px;padding:0 12px;border-radius:10px;border:0;background:rgba(255,255,255,.14);color:var(--bg);font-weight:700}
.timer .prog{position:absolute;left:16px;right:16px;bottom:5px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.timer .prog i{display:block;height:100%;background:var(--day);width:0}
.swipehint{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--ink-2);font-size:14px;font-weight:600;margin:4px 0 14px}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.cal-head h2{margin:0;font-size:28px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:12.5px;font-weight:700;color:var(--ink-2);padding:4px 0}
.cal button{aspect-ratio:1/1.08;border:1px solid transparent;border-radius:12px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 0 0;gap:4px;font-weight:650;font-size:15px;min-width:0}
.cal button.out{visibility:hidden}
.cal button.today{border-color:var(--ink)}
.cal button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cal .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:90%}
.cal .dots i{width:7px;height:7px;border-radius:50%}
.sesslist .card h3{display:flex;align-items:center;gap:8px}
.exrow{padding:8px 0;border-top:1px solid var(--line)}
.exrow:first-of-type{border-top:0}
.exrow b{font-weight:700}
.exrow .linkish{text-align:left;display:inline;font-size:16px;color:var(--ink);text-decoration-color:var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.stats b{display:block;font-size:24px}
.stats span{font-size:12.5px;color:var(--ink-2);font-weight:600}

/* progress */
.seg-ctl{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px}
.seg-ctl button{flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;font-weight:650;font-size:14px}
.seg-ctl button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chart svg{display:block;width:100%;height:auto}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist th{text-align:left;font-size:12.5px;color:var(--ink-2);font-weight:650;padding:6px 4px;border-bottom:1px solid var(--line)}
.hist td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tablewrap{overflow-x:auto}
.orm{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.orm b{font-size:40px}

.list-item{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:10px 0;border-top:1px solid var(--line)}
.list-item .acts{display:flex;gap:6px;margin-left:auto}
.list-item:first-child{border-top:0}
.list-item .grow{flex:1 1 150px;min-width:0}
.list-item .grow b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#session:not(.hide) ~ #toast .toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.s-foot{background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.s-foot .in{max-width:580px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
.s-count{background:none;border:0;padding:6px 4px;font-weight:700;font-size:15px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.exl{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px}
.exl:first-child{border-top:0}
.exl .k{font-weight:800;color:var(--ink-2);text-align:center}
.exl b{display:block;font-weight:700;line-height:1.25}
.exl[aria-current="true"]{background:var(--surface-2);border-radius:12px}
.exl .st{font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap;display:flex;gap:4px;align-items:center}
.exl .st.ok{color:var(--green)}
.barsel{display:flex;align-items:center;gap:6px;margin:8px 0 0;font-size:13px;font-weight:650;color:var(--ink-2)}
.barsel button{min-height:32px;padding:0 10px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:700}
.barsel button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* ---------- lectura de rutinas pegadas ---------- */
function parseSR(s) {
  const t = String(s || '').replace(/,/g, '.');
  const m = t.match(/(\d+)\s*[×xX\*]\s*(\d+)(?:\s*[-–]\s*(\d+))?\s*(.*)$/);
  if (!m) return {sets: 3, reps: 10, repsMax: null, unit: 'reps', per: '', extra: String(s || '')};
  let rest = m[4].trim(), unit = 'reps';
  if (/^(s\b|seg|sec|")/i.test(rest)) { unit = 's'; rest = rest.replace(/^(segundos|seg\.?|secs?|s|")/i, '').trim(); }
  else if (/^(metros|mts|m\b)/i.test(rest)) { unit = 'm'; rest = rest.replace(/^(metros|mts|m)/i, '').trim(); }
  else if (/^min/i.test(rest)) { unit = 's'; m[2] = String(+m[2] * 60); rest = rest.replace(/^min(utos)?/i, '').trim(); }
  let per = '';
  const pm = rest.match(/\/\s*([a-záéíóúñ]+)/i);
  if (pm) { per = pm[1].toLowerCase(); rest = rest.replace(pm[0], '').trim(); }
  return {sets: +m[1], reps: +m[2], repsMax: m[3] ? +m[3] : null, unit, per, extra: rest};
}
function parseLoad(s) {
  const t = String(s || '').replace(/,/g, '.');
  let m = t.match(/(\d+(?:\.\d+)?)\s*%?\s*[-–—]\s*(\d+(?:\.\d+)?)\s*%/);
  if (m) return {pMin: +m[1], pMax: +m[2]};
  m = t.match(/(\d+(?:\.\d+)?)\s*%/);
  if (m) return {pMin: +m[1], pMax: +m[1]};
  return {pMin: null, pMax: null};
}
function parseRest(s) {
  const t = String(s || '').replace(/,/g, '.').toLowerCase();
  const mult = (/min|'/.test(t) && !/\d\s*s\b|seg/.test(t)) ? 60 : 1;
  let m = t.match(/(\d+(?:\.\d+)?)\s*[-–]\s*(\d+(?:\.\d+)?)/);
  if (m) return {min: Math.round(+m[1] * mult), max: Math.round(+m[2] * mult)};
  m = t.match(/(\d+(?:\.\d+)?)/);
  if (m) return {min: Math.round(+m[1] * mult), max: Math.round(+m[1] * mult)};
  return {min: 60, max: 60};
}
function makeExercise(name, sr, load, rest) {
  const a = parseSR(sr), b = parseLoad(load), c = parseRest(rest);
  const clean = String(name || '').replace(/\*\*/g, '').trim();
  return {name: clean, key: exKey(clean), srText: String(sr || '').trim(), sets: clamp(a.sets, 1, 12), reps: a.reps, repsMax: a.repsMax,
    unit: a.unit, per: a.per, extra: a.extra, pMin: b.pMin, pMax: b.pMax, loadText: String(load || '').trim(),
    restText: String(rest || '').trim(), restMin: c.min, restMax: c.max};
}
function newDay(line, n) {
  const s = line.replace(/[*#_]/g, '').trim();
  let label = 'Día ' + n, note = '', title = s;
  const m = s.match(/^((?:d[ií]a|day|sesi[oó]n|entreno)\s*\d+)\s*(?:\(([^)]*)\))?\s*[:\-–—.]?\s*(.*)$/i);
  if (m) { label = m[1].replace(/^./, c => c.toUpperCase()); note = (m[2] || '').trim(); title = (m[3] || '').trim() || label; }
  return {label, title, note, optional: /voluntari|opcional/i.test(note), desc: '', exercises: []};
}
function parseRoutineText(text) {
  const lines = String(text || '').split(/\r?\n/);
  const days = [];
  let cur = null, cols = null, name = '';
  const isDayLine = l => /^(?:#+\s*)?\**\s*(d[ií]a|day|sesi[oó]n|entreno)\s*\d+/i.test(l);
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('|')) {
      const cells = line.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
      if (cells.every(c => /^:?-{2,}:?$/.test(c) || c === '')) continue;
      if (/^(ejercicio|exercise|movimiento)/i.test(norm(cells[0]))) {
        const idx = re => cells.findIndex(c => re.test(norm(c)));
        cols = {name: 0, sr: Math.max(1, idx(/series|reps|×|sets/)), load: idx(/carga|%|peso|intensidad|load/), rest: idx(/descanso|rest|pausa/)};
        if (!cur) { cur = newDay('Día ' + (days.length + 1), days.length + 1); days.push(cur); }
        continue;
      }
      if (!cur) { cur = newDay('Día ' + (days.length + 1), days.length + 1); days.push(cur); }
      const c = cols || {name: 0, sr: 1, load: 2, rest: 3};
      const nm = cells[c.name];
      if (!nm) continue;
      cur.exercises.push(makeExercise(nm, cells[c.sr] || '', c.load >= 0 ? cells[c.load] || '' : '', c.rest >= 0 ? cells[c.rest] || '' : ''));
    } else if (isDayLine(line)) {
      cur = newDay(line, days.length + 1); days.push(cur); cols = null;
    } else if (cur && cur.exercises.length) {
      cur = newDay(line, days.length + 1); days.push(cur); cols = null;
    } else if (cur) {
      cur.desc = (cur.desc ? cur.desc + ' ' : '') + line.replace(/[*#_]/g, '');
    } else if (!name) {
      name = line.replace(/[*#_]/g, '').trim();
    }
  }
  const out = days.filter(d => d.exercises.length);
  out.forEach((d, i) => { d.color = PLATE_COLORS[i % 4]; });
  return {name, days: out};
}
function routineFrom(parsed, fallbackName) {
  return {id: uid(), name: parsed.name || fallbackName || 'Rutina', createdAt: Date.now(), days: parsed.days};
}

function plateSVG(total) {

/* ---------- gráfica ---------- */
function chartSVG(pts, unit) {
  if (!pts.length) return '';
  const W = 340, H = 190, pl = 40, pr = 12, pt = 14, pb = 28;
  const xs = pts.map(p => parseISO(p.date).getTime()), ys = pts.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 864e5 * 3; x1 += 864e5 * 3; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = Math.max(2, (y1 - y0) * 0.15); y0 = Math.max(0, y0 - pad); y1 += pad;
  const X = v => pl + (v - x0) / (x1 - x0) * (W - pl - pr), Y = v => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);
  const ticks = [y0, (y0 + y1) / 2, y1];
  const grid = ticks.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink-2)">${fk(Math.round(v))}</text>`).join('');
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(xs[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  const dots = pts.map((p, i) => `<circle cx="${X(xs[i])}" cy="${Y(p.y)}" r="4.5" fill="var(--surface)" stroke="var(--day)" stroke-width="2.5"><title>${fDate(p.date)}: ${fk(p.y)} ${unit}</title></circle>`).join('');
  const lab = `<text x="${pl}" y="${H - 8}" font-size="11" fill="var(--ink-2)">${fDate(pts[0].date)}</text>` + (pts.length > 1 ? `<text x="${W - pr}" y="${H - 8}" text-anchor="end" font-size="11" fill="var(--ink-2)">${fDate(pts[pts.length - 1].date)}</text>` : '');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución">${grid}<path d="${path}" fill="none" stroke="var(--day)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}${lab}</svg>`;
}

function sampleErr(e) {

  if (c === 'images_unavailable') return 'En esta vista no se pueden enviar imágenes a Claude.';

  if (c === 'refused') return `${aiName()} no ha podido analizar este contenido.`;
  if (c === 'cancelled') return 'Análisis cancelado.';

}

      for (let k = j + 1; k < en.sets.length; k++) {
        if (en.sets[k].kg != null) break;
        const inp = box && $(`input[data-f="kg"][data-j="${k}"]`, box);
        if (inp) inp.value = v != null ? fk(v) : def != null ? fk(def) : '';
      }
      updateCombo(box, i, pid);
    }
    saveSession(sessionId(pid));
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.vid != null && t.files && t.files[0]) { const f = t.files[0]; t.value = ''; handleVideo(+t.dataset.vid, f); return; }
  if (t.dataset && t.dataset.ch === 'prog-ex') { S.prog.key = t.value; render(); }
  if (t.dataset && t.dataset.restore && t.files && t.files[0]) {
    const f = t.files[0]; t.value = '';
    f.text().then(txt => {
      let j; try { j = JSON.parse(txt); } catch { toast('Ese archivo no es una copia de Discos.'); return; }
      const d = j && j.app === 'discos' && j.data;
      if (!d || !d.app || !Array.isArray(d.app.profiles) || !Array.isArray(d.app.routines)) { toast('Ese archivo no es una copia de Discos.'); return; }
      sheetConfirm(`Se sustituirán los datos de este móvil por los de la copia del ${esc(fDateLong(String(j.exportedAt || todayISO()).slice(0, 10)))}.`, 'Restaurar', () => {
        const app = d.app; if (!epochOk(app)) app.epoch = CODE_EPOCH;
        const ses = d.sessions || {}; for (const id in ses) ses[id].epoch = app.epoch;
        S.app = app; S.sessions = ses; S.live = null; S.cal = null; S.prog = {pid: null, key: null, metric: 'top'};
        LS.set('sessions', S.sessions); saveLive(); saveApp(); applyTheme(); render(); toast('Copia restaurada');
      });
    }).catch(() => toast('No se ha podido leer el archivo.'));
  }
  if (t.dataset && /^db-(min|max|step)$/.test(t.dataset.ch || '')) {
    const v = toNum(t.value), g = S.app.settings.gym = S.app.settings.gym || {}; const db = g.db = {...gym().db};
    const f = t.dataset.ch.slice(3);
    if (v && v > 0 && v <= 200) { db[f] = v; if (db.min > db.max) db.max = db.min; saveApp(); }
    render();
  }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.dataset && t.dataset.f) {
    e.preventDefault();
    const all = $$('input[data-f]', t.closest('.person')); const k = all.indexOf(t);
    if (k >= 0 && k < all.length - 1) all[k + 1].focus(); else t.blur();
    return;
  }
  if (e.key === 'Escape' && $('#sheet .sheet')) { closeSheet(); return; }
  if (!S.live || $('#session').classList.contains('hide') || $('#sheet .sheet')) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName || '')) return;
  if (e.key === 'ArrowRight') { goPage(S.live.page + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { goPage(S.live.page - 1); e.preventDefault(); }
});

/* ---------- arranque ---------- */
applyTheme();
if (S.live && !S.live.backfill && S.live.date !== todayISO()) { S.live = null; saveLive(); }
render();
connectDb();
connectSample();
window.discosBack = () => {
  if ($('#sheet .sheet')) { closeSheet(); return true; }
  if (S.live && !$('#session').classList.contains('hide')) { stopTimer(); closeSessionView(); return true; }
  if (S.view !== 'home') { S.view = 'home'; render(); window.scrollTo(0, 0); return true; }
  return false;
};
if (STANDALONE && !window.DiscosAndroid) {
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (S.view === 'settings') render(); });
  window.addEventListener('appinstalled', () => { S.installEvt = null; toast('Discos instalada'); });
}
// copia sin conexión: también dentro de la app de Android, que abre esta página
if (STANDALONE && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && location.hostname !== 'appassets.androidplatform.net') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
